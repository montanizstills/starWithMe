# Example course that ships with starWithMe, like .env.example (SWM-198).
# Format: SWM-204. One folder = one Canvas course; each numbered note
# (NNN-slug.md) is one lesson, in number order. The folder name is the
# course's SIS id, a note's file name is its id, and its first heading is
# its title. A lesson's quiz sits beside it as NNN-slug.quiz.yml.
# Field names are Canvas's own API names.

name: Browser automation with Playwright and browser-use
course_code: EX-PW-101
default_view: modules
public_description: >
  Write reliable browser tests with Playwright, point them at a real Canvas
  instance, then let a browser-use agent explore the same pages and turn what
  it finds into tests.

# Inherited by every quiz in this folder; a quiz file may override any of them.
defaults:
  quiz:
    quiz_type: assignment
    allowed_attempts: -1    # unlimited: the student test reruns against the same Canvas
    time_limit: null        # no time limit
    scoring_policy: keep_highest
    shuffle_answers: true
    show_correct_answers: true
    published: true

# SIS Import users.csv rows (SWM-205), each enrolled in this course as a student.
# No email. The password is never written here: courses apply reads it from
# TEST_STUDENT_PASSWORD at apply time.
sis_users:
  - user_id: ex-pw-101-student
    login_id: ex-pw-101-student
    full_name: Example Student
    status: active
