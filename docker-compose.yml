services:
  web:
    # Canvas, its gems and compiled assets are baked into this image (SWM-229).
    # The Mac builds it locally (starwithme-canvas:local); set CANVAS_IMAGE in
    # .env to run a published ghcr.io/montanizstills/starwithme-canvas tag instead.
    image: ${CANVAS_IMAGE:-starwithme-canvas:local}
    build: .
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      # Secrets come from .env (gitignored); see .env.example
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Canvas initial-setup credentials (consumed once by db:initial_setup)
      CANVAS_LMS_ADMIN_EMAIL: ${CANVAS_ADMIN_EMAIL:?set CANVAS_ADMIN_EMAIL in .env}
      CANVAS_LMS_ADMIN_PASSWORD: ${CANVAS_ADMIN_PASSWORD:?set CANVAS_ADMIN_PASSWORD in .env}
      CANVAS_LMS_ACCOUNT_NAME: ${CANVAS_ACCOUNT_NAME:-My Canvas}
      CANVAS_LMS_STATS_COLLECTION: opt_out
    volumes:
      - canvas-data:/data
      # Uploads (file_store path_prefix tmp/files); the code itself is in the image
      - canvas-files:/canvas/tmp/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Background jobs (email, course imports/copies, file processing, exports)
  jobs:
    # Same image as web; web's build section builds it
    image: ${CANVAS_IMAGE:-starwithme-canvas:local}
    command: ["jobs"]
    environment:
      RAILS_ENV: development
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - canvas-data:/data
      - canvas-files:/canvas/tmp/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started

  db:
    image: postgres:16-alpine
    # Localhost only, for desktop DB tools (DBeaver etc.)
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: canvas_development
      POSTGRES_USER: canvas
      # Only applied when pgdata is first created; rotate later with ALTER USER
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canvas -d canvas_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  canvas-data:
  canvas-files:
  pgdata:
