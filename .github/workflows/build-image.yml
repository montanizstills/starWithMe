# Builds the prebuilt Canvas image (SWM-229) on GitHub's own runners: arm64
# for the Oracle VM on the free ubuntu-24.04-arm runner, amd64 for CI. Each
# build is checked (image smoke tests and a secret scan) before anything is
# pushed. The run page shows every build step live.
#
# Publishing to GHCR happens only on a manual trigger: "Run workflow" with
# publish ticked (shown once this file is on the default branch), or pushing a
# canvas-image-* tag. Pull requests build and check, but never push.
name: build-image

on:
  pull_request:
    branches: [dev]
    paths:
      - Dockerfile
      - entrypoint.sh
      - tools/canvas-image-tag.sh
      - tests/local/smoke.sh
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to GHCR
        type: boolean
        default: false
  push:
    tags: ['canvas-image-*']

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/montanizstills/starwithme-canvas
  PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    timeout-minutes: 240
    outputs:
      tag: ${{ steps.tags.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # Canvas source, gems, node modules and the compile outgrow the runner's free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Work out the tags
        id: tags
        run: |
          tag=$(tools/canvas-image-tag.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "CANVAS_IMAGE=$IMAGE:$tag-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "Image: $IMAGE:$tag (Canvas $(sed -n 's/^ARG CANVAS_REF=//p' Dockerfile | cut -c1-12), commit ${GITHUB_SHA::12})"

      - name: Build the image
        run: docker build --progress=plain -t "$CANVAS_IMAGE" .

      # Smoke tests read compose, which needs these set; nothing here is real
      - name: Throwaway .env
        run: |
          printf '%s\n' "POSTGRES_PASSWORD=$(openssl rand -hex 24)" \
            CANVAS_ADMIN_EMAIL=ci-admin@example.test "CANVAS_ADMIN_PASSWORD=$(openssl rand -hex 24)" > .env

      - name: Image checks (gems, assets, no .env or secrets in env)
        run: tests/local/smoke.sh image

      # Skipped: installed gems and Ruby, and Canvas's published API docs, whose
      # examples include sample JWTs (22 findings, none ours; checked 2026-11-15)
      - name: Secret scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
            image --scanners secret --exit-code 1 --no-progress \
            --skip-dirs /usr/local/bundle --skip-dirs /usr/local/lib/ruby \
            --skip-dirs /canvas/doc --skip-dirs /canvas/public/doc \
            "$CANVAS_IMAGE"

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push ${{ matrix.arch }}
        if: env.PUBLISH == 'true'
        run: docker push "$CANVAS_IMAGE"

  # One multi-arch tag per name, pointing at both builds
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish == true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # The package must stay private (SWM-15, comment 10172). A package linked to
      # a public repo can come out public, and the API can't change that, so
      # stop before tagging if it isn't private and fix it in the package settings.
      - name: Check the package is private
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          visibility=$(gh api /users/montanizstills/packages/container/starwithme-canvas --jq .visibility 2>/dev/null || echo unknown)
          echo "Package visibility: $visibility"
          if [ "$visibility" = public ]; then
            echo "::error::ghcr.io/montanizstills/starwithme-canvas is PUBLIC. Set it to private: GitHub > Packages > starwithme-canvas > Package settings > Change visibility."
            exit 1
          fi
          [ "$visibility" = private ] || echo "::warning::Could not read the package visibility; check it is private in the package settings."

      - name: Tag build, Canvas ref, git SHA and latest
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          canvas=$(sed -n 's/^ARG CANVAS_REF=//p' Dockerfile | cut -c1-12)
          for name in "$TAG" "canvas-$canvas" "sha-${GITHUB_SHA::12}" latest; do
            docker buildx imagetools create -t "$IMAGE:$name" "$IMAGE:$TAG-arm64" "$IMAGE:$TAG-amd64"
            echo "Published $IMAGE:$name"
          done
