# M0 deployment test (SWM-22): every PR into dev gets the Canvas image, starts
# the full stack with throwaway secrets and runs the local smoke tests. The
# image is pulled from GHCR when one is published for this Dockerfile and
# entrypoint (SWM-229), and built here otherwise.
# Branch protection requires this check before anything merges to dev (SWM-33).
name: "PR Regression: Full Stack and Student Quiz"

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    name: "PR Regression: Full Stack and Student Quiz"
    runs-on: ubuntu-latest
    # Pulling takes minutes; building Canvas when no image is published takes 1-2 hours
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The Canvas image, gems and node_modules outgrow the runner's free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # SWM-31: fresh secrets every run, masked in logs, never stored
      - name: Generate throwaway .env
        run: |
          db_pw="$(openssl rand -hex 24)"
          admin_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$db_pw"
          echo "::add-mask::$admin_pw"
          {
            echo "POSTGRES_PASSWORD=$db_pw"
            echo "CANVAS_ADMIN_EMAIL=ci-admin@example.test"
            echo "CANVAS_ADMIN_PASSWORD=$admin_pw"
          } > .env

      # SWM-30, SWM-229
      - name: Get the Canvas image
        run: |
          image="ghcr.io/montanizstills/starwithme-canvas:$(tools/canvas-image-tag.sh)"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker pull -q "$image"; then
            echo "CANVAS_IMAGE=$image" >> .env
            echo "Pulled $image"
          else
            echo "No published image for this Dockerfile and entrypoint ($image); building it"
            docker compose build --progress=plain
          fi

      - name: Static and image checks
        run: tests/local/smoke.sh static && tests/local/smoke.sh image

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for Canvas (first-run database setup)
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/health_check || true)"
            if [ "$code" = 200 ]; then echo "Canvas up after ~$((i / 2)) min"; exit 0; fi
            if [ "$(docker compose ps web --status running -q | wc -l)" = 0 ]; then
              echo "web container stopped"; exit 1
            fi
            sleep 30
          done
          echo "Canvas not up after 30 min"; exit 1

      # SWM-32: any failed check fails the job
      - name: Smoke tests
        run: tests/local/smoke.sh runtime 2>&1 | tee smoke-runtime.log; exit "${PIPESTATUS[0]}"

      # SWM-205: courses apply against the real Canvas. The first run creates
      # the course, test student, modules, pages and quiz; the second must
      # report 0 changes. live_check.py then checks publishing, <pre> code and
      # the student's login. Uses the example course when it is on the branch.
      - name: Apply a course twice, check it, run the student test (SWM-205, SWM-226)
        run: |
          student_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$student_pw"
          # tools/canvas-token.rb: the site admin token (and SIS imports on).
          # Ruby errors go to runner.err (no secrets there) and are shown on failure.
          token="$(docker compose exec -T -e TOKEN_PURPOSE="deploy-test courses apply" web \
            bundle exec rails runner "$(cat tools/canvas-token.rb)" 2>runner.err | sed -n 's/^TOKEN=//p' | tail -1)"
          [ -n "$token" ] || { echo "Could not create an API token:"; grep -v "^[[:space:]]*from " runner.err | head -20; exit 1; }
          echo "::add-mask::$token"
          grep -v "^[[:space:]]*from \|Spring preloader" runner.err || true
          export CANVAS_API_TOKEN="$token" TEST_STUDENT_PASSWORD="$student_pw"
          course=tools/courses/tests/fixtures/mini-course
          [ -d courses/example-playwright-browser-use ] && course=courses/example-playwright-browser-use
          tools/courses/courses apply "$course" --target local > apply-first.json
          tools/courses/courses apply "$course" --target local > apply-second.json
          jq '{summary, skipped}' apply-first.json apply-second.json
          jq -e '.changes == []' apply-second.json > /dev/null || { echo "second apply was not 0 changes"; exit 1; }
          tools/courses/.venv/bin/python tools/courses/tests/live_check.py "$course" apply-first.json
          # SWM-226: the student test. The test student logs in, takes the example
          # quiz and must score full marks. Needs the example course.
          if [ "$course" = courses/example-playwright-browser-use ]; then
            CANVAS_URL=http://localhost:3000 PLAYWRIGHT_DEPS=1 tests/e2e/run.sh
          else
            echo "::warning::example course not on this branch; student test not run"
          fi

      # SWM-207: the hook ./start.sh --local runs. It makes its own token into
      # .env, then applies the example course, which is already there: 0 changes.
      - name: start.sh hook adds the example course (SWM-207)
        run: |
          out="$(tools/apply-example-course.sh 2>&1)"
          echo "$out"
          grep -q "token written" <<<"$out"
          grep -q "Example course applied: 0 change(s)." <<<"$out"
          grep -c '^CANVAS_API_TOKEN=.' .env

      # SWM-228: tools/rotate-admin-password.sh against the real Canvas. It
      # prints nothing; the old password and token stop working, the new ones
      # work (a real login form post), and the start.sh hook still applies the
      # course. Passwords go to curl from files, never on its command line.
      - name: Rotate the admin password (SWM-228)
        run: |
          old_token="$(sed -n 's/^CANVAS_API_TOKEN=//p' .env)"
          umask 077; mkdir -p rot
          sed -n 's/^CANVAS_ADMIN_PASSWORD=//p' .env | tr -d '\n' > rot/old
          rc=0; out="$(tools/rotate-admin-password.sh 2>&1)" || rc=$?
          sed -n 's/^CANVAS_ADMIN_PASSWORD=//p' .env | tr -d '\n' > rot/new
          echo "::add-mask::$(cat rot/new)"
          echo "::add-mask::$(sed -n 's/^CANVAS_API_TOKEN=//p' .env)"
          [ "$rc" = 0 ] || { echo "rotate exited $rc: $out"; exit 1; }
          [ -z "$out" ] || { echo "rotate printed output"; exit 1; }
          ! cmp -s rot/old rot/new || { echo ".env password did not change"; exit 1; }
          # Canvas login form: 302 to the dashboard when the password is right
          login() {
            rm -f rot/jar
            auth="$(curl -s -c rot/jar http://localhost:3000/login/canvas | sed -n 's/.*name="authenticity_token" value="\([^"]*\)".*/\1/p' | head -1)"
            curl -s -o /dev/null -w '%{http_code}' -b rot/jar -c rot/jar http://localhost:3000/login/canvas \
              --data-urlencode "authenticity_token=$auth" \
              --data-urlencode "pseudonym_session[unique_id]=ci-admin@example.test" \
              --data-urlencode "pseudonym_session[password]@$1"
          }
          new_code="$(login rot/new)"; old_code="$(login rot/old)"
          echo "login with new password: HTTP $new_code; with old: HTTP $old_code"
          [ "$new_code" = 302 ] || { echo "new password does not log in"; exit 1; }
          [ "$old_code" != 302 ] || { echo "old password still logs in"; exit 1; }
          api() { curl -s -o /dev/null -w '%{http_code}' -K - http://localhost:3000/api/v1/users/self; }
          old_api="$(printf 'header = "Authorization: Bearer %s"\n' "$old_token" | api)"
          new_api="$(printf 'header = "Authorization: Bearer %s"\n' "$(sed -n 's/^CANVAS_API_TOKEN=//p' .env)" | api)"
          echo "API with new token: HTTP $new_api; with old: HTTP $old_api"
          [ "$new_api" = 200 ] && [ "$old_api" = 401 ] || { echo "token was not remade"; exit 1; }
          out="$(tools/apply-example-course.sh 2>&1)"
          echo "$out"
          grep -q "Example course applied: 0 change(s)." <<<"$out"
          rm -rf rot

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 > stack.log 2>&1 || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-output
          path: |
            smoke-runtime.log
            stack.log
            apply-first.json
            apply-second.json
            tests/e2e/test-results
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
