# M0 deployment test (SWM-22): every PR into dev builds the Canvas image,
# starts the full stack with throwaway secrets and runs the local smoke tests.
# Branch protection requires this check before anything merges to dev (SWM-33).
name: deploy-test

on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    # First run compiles Canvas assets (30-60 min locally)
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # The Canvas image, gems and node_modules outgrow the runner's free disk
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      # SWM-31: fresh secrets every run, masked in logs, never stored
      - name: Generate throwaway .env
        run: |
          db_pw="$(openssl rand -hex 24)"
          admin_pw="$(openssl rand -hex 24)"
          echo "::add-mask::$db_pw"
          echo "::add-mask::$admin_pw"
          {
            echo "POSTGRES_PASSWORD=$db_pw"
            echo "CANVAS_ADMIN_EMAIL=ci-admin@example.test"
            echo "CANVAS_ADMIN_PASSWORD=$admin_pw"
          } > .env

      # SWM-30
      - name: Build the Canvas image
        run: docker compose build

      - name: Static and image checks
        run: tests/local/smoke.sh static && tests/local/smoke.sh image

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for Canvas (first-run setup and asset compile)
        run: |
          for i in $(seq 1 240); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 http://localhost:3000/health_check || true)"
            if [ "$code" = 200 ]; then echo "Canvas up after ~$((i / 2)) min"; exit 0; fi
            if [ "$(docker compose ps web --status running -q | wc -l)" = 0 ]; then
              echo "web container stopped"; exit 1
            fi
            sleep 30
          done
          echo "Canvas not up after 120 min"; exit 1

      # SWM-32: any failed check fails the job
      - name: Smoke tests
        run: tests/local/smoke.sh runtime 2>&1 | tee smoke-runtime.log; exit "${PIPESTATUS[0]}"

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 > stack.log 2>&1 || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-test-output
          path: |
            smoke-runtime.log
            stack.log
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose down -v
