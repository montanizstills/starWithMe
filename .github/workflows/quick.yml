# Quick tier (SWM-226): fast checks on every PR into dev, no Canvas server and
# no secrets. Required on dev together with "PR Regression: Full Stack and
# Student Quiz" (deploy-test.yml, the slow tier).
# Check names follow "PR Regression: <what it covers>"; renaming a job means
# updating the Dev-Deploy-Rule ruleset's required checks.
# No path filters: a required check that is skipped stays pending.
#
# Standing rule (human, 2026-11-23): every story adds at least one automated
# check that fails without its change and runs in CI. Add quick ones here.
name: "PR Regression: Static and Unit"

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quick:
    name: "PR Regression: Static and Unit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Compose needs these to parse; throwaway values, never used to start anything
      - name: Static smoke (repo and compose)
        run: |
          printf 'POSTGRES_PASSWORD=x\nCANVAS_ADMIN_EMAIL=ci@example.test\nCANVAS_ADMIN_PASSWORD=x\n' > .env
          tests/local/smoke.sh static

      - name: Staging VM hardening (rpcbind off, reboot-safe bind)
        run: tests/infra/hardening.sh

      - name: shellcheck (warnings and errors)
        run: |
          shellcheck --version | head -2
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

      - name: rotate-admin-password with a fake Canvas (SWM-228)
        run: tests/local/rotate-admin-password.test.sh

      - name: courses tool unit tests (SWM-204, SWM-205)
        run: |
          python -m venv tools/courses/.venv
          tools/courses/.venv/bin/pip install -q -r tools/courses/requirements-dev.txt
          tools/courses/.venv/bin/python -m pytest -q tools/courses/tests

      - name: Validate every course folder
        run: |
          for d in courses/*/ tools/courses/tests/fixtures/*/; do
            [ -d "$d" ] || continue
            echo "validate $d"
            tools/courses/courses validate "$d" > /dev/null
          done
