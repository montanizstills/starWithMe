# Render Blueprint for Canvas LMS
# https://render.com/docs/blueprint-spec
# Repo: https://github.com/montanizstills/starWithMe
# Branch: docker-codespace

services:
  # Web Service - Main Rails Application
  - type: web
    name: canvas-web
    runtime: ruby
    repo: https://github.com/montanizstills/starWithMe
    branch: docker-codespace
    rootDir: canvas-lms
    buildCommand: |
      bundle install &&
      yarn install &&
      bundle exec rake canvas:compile_assets RAILS_ENV=production
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: canvas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: canvas-redis
          type: redis
          property: connectionString
      - key: CANVAS_DATABASE_PASSWORD
        generateValue: true
      - key: SECRET_KEY_BASE
        generateValue: true
    healthCheckPath: /health_check
    autoDeploy: true

  # Background Worker - Delayed Jobs
  - type: worker
    name: canvas-worker
    runtime: ruby
    repo: https://github.com/montanizstills/starWithMe
    branch: docker-codespace
    rootDir: canvas-lms
    buildCommand: bundle install
    startCommand: bundle exec script/delayed_job run
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_MASTER_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: canvas-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: canvas-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
    autoDeploy: true

  # Redis for caching and sessions
  - type: redis
    name: canvas-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru

databases:
  # PostgreSQL Database
  - name: canvas-db
    plan: starter
    databaseName: canvas_production
    user: canvas
